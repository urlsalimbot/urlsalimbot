<?xml version='1.0' encoding='utf-8'?>
<svg xmlns="http://www.w3.org/2000/svg" width="985px" height="460px" font-family="ConsolasFallback,Consolas,monospace" font-size="16px" role="img" aria-labelledby="title desc">
<title id="title">Earl Salimbot's GitHub profile</title>
<desc id="desc">A terminal-style profile card with contact details and GitHub stats.</desc>
<style>
@font-face {
src: local('Consolas'), local('Consolas Bold');
font-family: 'ConsolasFallback';
font-display: swap;
-webkit-size-adjust: 109%;
size-adjust: 109%;
}
.main {fill:#ffffff;}
.key {fill:#d6d3cb;}
.value {fill:#a5d6ff;}
.cc {fill:#363f4b;}
.art {fill:#c9d1d9;}
text, tspan {white-space: pre;}
</style>
<rect width="985px" height="460px" fill="#0D1117" rx="15" />
<g fill="#f8bc2d">
<text x="555" y="90" class="art">
<tspan x="555" y="90" />
<tspan x="555" y="112">                    =:</tspan>
<tspan x="555" y="134">                   -#=.</tspan>
<tspan x="555" y="156">                  :#*+-.</tspan>
<tspan x="555" y="178">                 .##*+=:.</tspan>
<tspan x="555" y="200">                .##**+=-:.</tspan>
<tspan x="555" y="222">                *##**+==::.           *:</tspan>
<tspan x="555" y="244">               *##***+==-.:.         *#=</tspan>
<tspan x="555" y="266">              +###***+===:.:.       *#*+:</tspan>
<tspan x="555" y="288">             =####***+===-.::.     *#**+=</tspan>
<tspan x="555" y="310">            -####*****====::::.   *##**++:</tspan>
<tspan x="555" y="332">           :#####*****=====::::.:*##***++=.</tspan>
<tspan x="555" y="354">          :#####******=====:.:.:*###***+=+.</tspan>
<tspan x="555" y="376">         .######******======:.:*###****+=+=</tspan>
<tspan x="555" y="398">        .#######****#*+====+-:*%#######++++:</tspan>
<tspan x="555" y="420">        -+=++++=======------:-+=++=====----:</tspan>
</text>
<text x="20" y="30" opacity="0"><set attributeName="opacity" to="1" begin="0s" fill="freeze" /><tspan> — </tspan><tspan class="main">Earl Salimbot</tspan><tspan> ————————————————————————————————————————————————</tspan></text>
<text x="20" y="70" opacity="0"><set attributeName="opacity" to="1" begin="0.06s" fill="freeze" /> — <tspan class="main">About</tspan> —————————————————————————————————————————</text>
<text x="20" y="90" opacity="0"><set attributeName="opacity" to="1" begin="0.12s" fill="freeze" /><tspan> • </tspan><tspan class="key">OS</tspan>:<tspan class="cc"> .......................... </tspan><tspan class="value">Linux, Windows</tspan></text>
<text x="20" y="110" opacity="0"><set attributeName="opacity" to="1" begin="0.18s" fill="freeze" /><tspan> • </tspan><tspan class="key">Uptime</tspan>:<tspan class="cc" id="age_data_dots"> ...................... </tspan><tspan class="value" id="age_data">25 years, 11 months, 22 days</tspan></text>
<text x="20" y="130" opacity="0"><set attributeName="opacity" to="1" begin="0.24s" fill="freeze" /><tspan> • </tspan><tspan class="key">Languages.Programming</tspan>:<tspan class="cc"> ....... </tspan><tspan class="value">Python, C++, C#, TypeScript</tspan></text>
<text x="20" y="150" opacity="0"><set attributeName="opacity" to="1" begin="0.30s" fill="freeze" /><tspan> • </tspan><tspan class="key">Languages.Spoken</tspan>:<tspan class="cc"> ............ </tspan><tspan class="value">English, Filipino</tspan></text>
<text x="20" y="190" opacity="0"><set attributeName="opacity" to="1" begin="0.36s" fill="freeze" /> — <tspan class="main">Contact</tspan> ———————————————————————————————————————</text>
<text x="20" y="210" opacity="0"><set attributeName="opacity" to="1" begin="0.42s" fill="freeze" /><tspan> • </tspan><tspan class="key">LinkedIn</tspan>:<tspan class="cc"> .................... </tspan><tspan class="value">earl-salimbot</tspan></text>
<text x="20" y="230" opacity="0"><set attributeName="opacity" to="1" begin="0.48s" fill="freeze" /><tspan> • </tspan><tspan class="key">GitHub</tspan>:<tspan class="cc"> ...................... </tspan><tspan class="value">urlsalimbot</tspan></text>
<text x="20" y="250" opacity="0"><set attributeName="opacity" to="1" begin="0.54s" fill="freeze" /><tspan> • </tspan><tspan class="key">Website</tspan>:<tspan class="cc"> ..................... </tspan><tspan class="value">urlsalimbot.github.io</tspan></text>
<text x="20" y="290" opacity="0"><set attributeName="opacity" to="1" begin="0.60s" fill="freeze" /> — <tspan class="main">Stats</tspan> —————————————————————————————————————————</text>
<text x="20" y="310" opacity="0"><set attributeName="opacity" to="1" begin="0.66s" fill="freeze" /><tspan> • </tspan><tspan class="key">Repos</tspan>:<tspan class="cc" id="repo_data_dots"> ....................... </tspan><tspan class="value" id="repo_data">13</tspan><tspan class="value"> | Contributed: </tspan><tspan class="value" id="contrib_data">15</tspan></text>
<text x="20" y="330" opacity="0"><set attributeName="opacity" to="1" begin="0.72s" fill="freeze" /><tspan> • </tspan><tspan class="key">Contributions</tspan>:<tspan class="cc" id="commit_data_dots"> ............... </tspan><tspan class="value" id="commit_data">2,218</tspan><tspan class="value"> | Followers: </tspan><tspan class="value" id="follower_data">0</tspan></text>
<text x="20" y="350" opacity="0"><set attributeName="opacity" to="1" begin="0.78s" fill="freeze" /><tspan> • </tspan><tspan class="key">Stars</tspan>:<tspan class="cc" id="star_data_dots"> ....................... </tspan><tspan class="value" id="star_data">1</tspan><tspan class="value"> | Public since: 2021</tspan></text>
<text x="35" y="410" opacity="0"><set attributeName="opacity" to="1" begin="1.15s" fill="freeze" /><tspan>╭──(</tspan><tspan class="value">earl</tspan><tspan>@</tspan><tspan class="value">dev</tspan><tspan>)-[</tspan><tspan class="main">~</tspan><tspan>]</tspan></text>
<text x="35" y="430" opacity="0"><set attributeName="opacity" to="1" begin="1.15s" fill="freeze" /><tspan>╰─</tspan><tspan class="value">$</tspan><tspan class="main"> <tspan>█<animate attributeName="opacity" values="1;0" dur="1s" begin="1.15s" calcMode="discrete" repeatCount="indefinite" /></tspan></tspan></text>
</g>
</svg>